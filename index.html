  <body style="background:#050b13">
    <!-- Intro: neon logo lighting up. Inline so it shows before the app bundle loads. -->
    <div id="intro" style="position:fixed;inset:0;z-index:9999;background:#02040a;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease;cursor:pointer">
      <!-- poster + inline-player attributes stop some Android browsers (e.g. Xiaomi's) from
           swapping in their own player, which showed a cached site icon mid-intro -->
      <!-- playback (with or without sound) is started by the script below -->
      <video id="intro-video" src="/asset/neon-logo.mp4" poster="/intro-poster.png" muted playsinline preload="auto" disablepictureinpicture
        webkit-playsinline x5-playsinline x5-video-player-type="h5-page" controlslist="nodownload nofullscreen noremoteplayback"
        style="width:min(82vw,460px);aspect-ratio:1;object-fit:cover;pointer-events:none;-webkit-mask-image:radial-gradient(circle,#000 52%,transparent 71%);mask-image:radial-gradient(circle,#000 52%,transparent 71%)"></video>
    </div>
    <script>
      (function () {
        var INTRO_SECONDS = 5.5; // hide once the logo has lit up
        var el = document.getElementById('intro');
        var v = document.getElementById('intro-video');
        var seen = null;
        try { seen = sessionStorage.getItem('introSeen'); } catch (e) {}
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var internal = location.pathname.indexOf('/interno') === 0;
        if (seen || reduce || internal) { el.parentNode.removeChild(el); return; }
        try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
        }
        v.addEventListener('timeupdate', function () { if (v.currentTime >= INTRO_SECONDS) hide(); });
        v.addEventListener('ended', hide);
        v.addEventListener('error', hide);
        el.addEventListener('click', hide); // tapping anywhere else skips the intro
        var cap = setTimeout(hide, 8000); // never block the site on slow connections

        // Browsers usually block autoplay with sound on a first visit: try with
        // sound, and if refused keep playing muted.
        v.muted = false;
        var p = v.play();
        if (p && p.catch) {
          p.catch(function () {
            v.muted = true;
            var q = v.play();
            if (q && q.catch) q.catch(function () { setTimeout(hide, 800); });
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
